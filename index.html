<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101827"><title>Offline Tic Tac Toe</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f4f7ff;background:#101827}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}.app{width:min(100%,430px);background:#1b2940;border:1px solid #334663;border-radius:25px;padding:23px;box-shadow:0 20px 60px #0005}h1{text-align:center;margin:0 0 8px;font-size:29px}.sub{text-align:center;color:#aebed6;margin:0 0 22px}label{display:block;font-size:13px;color:#bdcbe0;margin:14px 0 6px}select,button{font:inherit}select{width:100%;background:#101827;color:white;border:1px solid #4c6383;border-radius:10px;padding:12px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.score{text-align:center;background:#111d30;padding:12px 4px;border-radius:12px}.score b{display:block;font-size:25px;margin-top:5px}.status{text-align:center;font-size:19px;font-weight:700;min-height:29px;margin:12px 0 18px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;background:#293c59;border:1px solid #456080;border-radius:16px;font-size:clamp(48px,15vw,75px);font-weight:800;color:#6bd9ff;touch-action:manipulation}.cell.o{color:#ffc879}.cell:disabled{opacity:1}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;border:0;border-radius:12px;padding:14px 8px;font-weight:700;color:white;background:#3867df}.actions button+button{background:#344762}.foot{text-align:center;font-size:12px;color:#aebed6;margin:18px 0 0}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));}</script></head><body><main class="app"><h1>✕ Tic Tac Toe ◯</h1><p class="sub">Play anywhere. No internet needed.</p><label for="mode">Game mode</label><select id="mode"><option value="cpu">Against computer</option><option value="friend">Two players (same phone)</option></select><div id="difficultyWrap"><label for="difficulty">Computer difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard" selected>Impossible</option></select></div><div class="scores"><div class="score">X wins<b id="xScore">0</b></div><div class="score">Ties<b id="ties">0</b></div><div class="score">O wins<b id="oScore">0</b></div></div><div class="status" id="status" aria-live="polite">Your turn (X)</div><div class="board" id="board" aria-label="Tic Tac Toe board"></div><div class="actions"><button id="new">New round</button><button id="reset">Reset scores</button></div><p class="foot">Everything runs locally on this device.</p></main><script>const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),mode=document.getElementById('mode'),difficulty=document.getElementById('difficulty');let board,turn,over,busy,scores={X:0,O:0,tie:0};const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function result(b){for(const [a,c,d] of lines)if(b[a]&&b[a]===b[c]&&b[c]===b[d])return b[a];return b.every(Boolean)?'tie':null}function render(){boardEl.innerHTML='';board.forEach((v,i)=>{const btn=document.createElement('button');btn.className='cell '+(v==='O'?'o':'');btn.textContent=v;btn.setAttribute('aria-label',`Row ${Math.floor(i/3)+1}, column ${i%3+1}${v?', '+v:''}`);btn.disabled=!!v||over||busy;btn.onclick=()=>move(i);boardEl.append(btn)});document.getElementById('xScore').textContent=scores.X;document.getElementById('oScore').textContent=scores.O;document.getElementById('ties').textContent=scores.tie}function start(){board=Array(9).fill('');turn='X';over=false;busy=false;statusEl.textContent=mode.value==='cpu'?'Your turn (X)':'X’s turn';render()}function move(i){if(over||busy||board[i])return;board[i]=turn;const outcome=result(board);if(outcome){over=true;scores[outcome]++;statusEl.textContent=outcome==='tie'?'It’s a tie!':mode.value==='cpu'?(outcome==='X'?'You win! 🎉':'Computer wins!'):`${outcome} wins! 🎉`;render();return}turn=turn==='X'?'O':'X';if(mode.value==='cpu'&&turn==='O'){busy=true;statusEl.textContent='Computer thinking…';render();setTimeout(()=>{busy=false;const pick=cpuPick();if(pick!==undefined)move(pick)},240)}else{statusEl.textContent=`${turn}’s turn`;render()}}function cpuPick(){const open=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(!open.length)return;const random=()=>open[Math.floor(Math.random()*open.length)];if(difficulty.value==='easy')return random();if(difficulty.value==='medium'&&Math.random()<.5)return random();let best=-Infinity,choices=[];for(const i of open){board[i]='O';const score=minimax(board,false,0);board[i]='';if(score>best){best=score;choices=[i]}else if(score===best)choices.push(i)}return choices[Math.floor(Math.random()*choices.length)]}function minimax(b,maximizing,depth){const r=result(b);if(r)return r==='O'?10-depth:r==='X'?depth-10:0;let best=maximizing?-Infinity:Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]=maximizing?'O':'X';const s=minimax(b,!maximizing,depth+1);b[i]='';best=maximizing?Math.max(best,s):Math.min(best,s)}return best}mode.onchange=()=>{document.getElementById('difficultyWrap').hidden=mode.value!=='cpu';start()};difficulty.onchange=start;document.getElementById('new').onclick=start;document.getElementById('reset').onclick=()=>{scores={X:0,O:0,tie:0};start()};start();</script></body></html>
